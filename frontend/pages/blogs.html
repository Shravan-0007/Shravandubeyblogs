<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(to bottom right, #FF9933, #FF6600); /* Kesari gradient */
            font-family: 'Arial', sans-serif;
            margin: 0;
            transition: background 0.5s ease-in-out;
        }

        h1 {
            color: white;
            font-size: 2rem;
            text-align: center;
        }

        /* Blog Container */
        .blog-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        /* Blog Card */
        .blog-card {
            background: #fff;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            text-align: left;
            cursor: pointer;
        }

        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
        }

        .blog-card h3 {
            font-size: 1.5rem;
            color: #333;
        }

        .blog-card p {
            font-size: 1rem;
            color: #666;
        }

        .blog-card img {
            width: 100%;
            border-radius: 5px;
            margin-top: 10px;
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>ALL Blogs</h1>
    
    <div class="blog-container" id="blogContainer"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch("/api/blogs")
                .then(response => response.json())
                .then(blogs => {
                    const blogContainer = document.getElementById("blogContainer"); // ✅ Fixed the ID

                    blogContainer.innerHTML = ""; // Clear previous content

                    if (blogs.length === 0) {
                        blogContainer.innerHTML = "<p>No blogs available</p>";
                        return;
                    }

                    blogs.forEach(blog => {
                        const blogElement = document.createElement("div");
                        blogElement.classList.add("blog-card");
                        blogElement.innerHTML = `
                            <h3>${blog.title}</h3>
                            <p>${blog.description}</p>
                            <img src="${blog.image}" alt="Blog Image">
                            <a href="/blog-details?id=${blog._id}" class="btn">Read More</a>
                        `;
                        blogContainer.appendChild(blogElement);
                    });
                })
                .catch(error => console.error("Error fetching blogs:", error));
        });
    </script>

</body>
</html>
