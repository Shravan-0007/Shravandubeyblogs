<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>  <!--remix icon -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #e57e62;
            text-align: center;
            padding: 20px;
        }
        /* Back Button */
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: black;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .back-button:hover {
            background: #5c4b5c;
        }

        .container {
            max-width: 800px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            padding: 30px;
            margin: auto;
            position: relative;
        }

        h2 {
            margin-bottom: 10px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: linear-gradient(to bottom right, #FF9933, #FF6600);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover{
            background: rgb(228, 114, 48);
        }
        .social-media {
            display: flex;
            justify-content: center;
            font-size: 34px;
            margin-right: 10px;
        }
        .social-media a{
            text-decoration: none;
            color: black;
        }
        .social-media a:hover{
            color: rgb(229, 32, 32);
        }

        .footer {
            margin-top: 20px;
            padding: 10px;
            background: #333;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Back Button -->
    <button class="back-button" onclick="goBack()">⬅️ Back</button>

    <div class="container">
        <h2>Contact Us</h2>
        <p>Feel free to reach out with any questions or inquiries.</p>
        <form>
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" placeholder="Your Message" rows="4" required></textarea>
            <button type="submit">Send Message</button>
        </form>
        
        <!-- Social media accounts -->
        <div class="social-media">
        <a href="#"><i class="ri-facebook-circle-fill"></i></a>
        <a href="#"><i class="ri-instagram-fill"></i></a>
        <a href="#"><i class="ri-twitter-x-line"></i></a>
    </div>
    </div>

    <div class="footer">
        &copy; 2025 ShravanDubeyBlogs.com All Rights Reserved.
    </div>

    <script>
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
